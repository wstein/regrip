name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download validated coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ github.event.workflow_run.head_sha }}
          path: docs/site/public/coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - run: npm run build
        env:
          VITE_REGRIP_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
      - run: npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Publish deployment links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo '## Regrip deployment'
            echo
            echo "[Open live demo](${PAGE_URL})"
            echo
            echo "[Browse deployed source](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${SOURCE_SHA})"
          } >> "$GITHUB_STEP_SUMMARY"
