name: Validate product release

on:
  push:
    tags:
      - 'regrip-v*'

permissions:
  contents: read

jobs:
  validate:
    name: Test and build product release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: regrip-product-${{ github.ref_name }}
          path: dist
          if-no-files-found: error
          retention-days: 30
