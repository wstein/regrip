version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /tools/gentype-canary
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      commitlint:
        patterns: ['@commitlint/*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Git dependencies are deliberately pinned to reviewed revisions.
      - dependency-name: smartcube-web-bluetooth
      - dependency-name: cubing
      # cubing.js bundles Three 0.170.0; a single runtime is enforced by check:three-singleton.
      - dependency-name: three
      - dependency-name: '@types/three'
      # rescript-vitest@3 uses the Vitest 4 API. Upgrade both deliberately.
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      # eslint-plugin-import@2 is compatible through ESLint 9 only.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeDoc 0.28.x supports TypeScript through 6.x (holds at TS 6, ignores TS 7+).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      github-actions:
        patterns: ['*']
