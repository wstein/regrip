version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # This protocol dependency is deliberately pinned to a reviewed commit.
      - dependency-name: smartcube-web-bluetooth
      # rescript-vitest@3 uses the Vitest 4 API. Upgrade both deliberately.
      - dependency-name: vitest
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
