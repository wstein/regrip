<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1325" />
    <title>Regrip API</title>
    <style>
      :root {
        --color-bg: #090d18;
        --color-surface: #10192c;
        --color-text: #edf2ff;
        --color-accent: #8bb7ff;
        --color-divider: #2b3859;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 46rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        color: var(--color-text);
        background: var(--color-bg);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        line-height: 1.55;
      }
      h1 {
        font-weight: 800;
        letter-spacing: -0.015em;
        margin: 0 0 1rem;
      }
      a {
        color: var(--color-accent);
        text-underline-offset: 3px;
      }
      a:hover {
        color: #c3daff;
      }
      code {
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      pre {
        margin: 1rem 0;
        padding: 1rem;
        overflow-x: auto;
        border: 1px solid var(--color-divider);
        background: var(--color-surface);
      }
      hr {
        height: 2px;
        border: 0;
        margin: 2rem 0;
        background: var(--color-divider);
      }
      nav {
        margin-top: 2rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Regrip API</h1>
    <p>
      The TypeScript-facing reference isn't generated in this checkout yet. Build it, then reload
      this page:
    </p>
    <pre><code>npm run docs:api</code></pre>
    <p>For source-native ReScript documentation JSON, inspect an interface directly:</p>
    <pre><code>npx rescript-tools doc src/domain/Quaternion.resi</code></pre>
    <hr />
    <nav><a href="../../">← Regrip lab</a> · <a href="../../docs.html">Docs</a></nav>
  </body>
</html>
